name: Deploy Client (Efficient)

on:
  workflow_dispatch:
    inputs:
      client_name:
        description: 'Client name (e.g., brown-feed)'
        required: true
        type: string
      domain:
        description: 'Client domain (e.g., brownfeedstore.com)'
        required: true
        type: string

      database_provider:
        description: 'Database provider'
        required: true
        type: choice
        options:
          - neon
          - supabase
          - planetscale
        default: neon

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Build frontend for deployment
        run: npm run build

      - name: Create efficient client deployment
        run: |
          chmod +x deploy-client-efficient.sh
          ./deploy-client-efficient.sh ${{ inputs.client_name }} ${{ inputs.domain }}

      - name: Setup client schema in shared database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd deployments/${{ inputs.client_name }}
          
          # Use shared database with client-specific schema
          echo "Setting up client schema in shared database..."
          
          # Install pg dependency for schema initialization
          npm install pg
          
          # Create schema initialization script as CommonJS
          cat > schema-init.cjs << 'EOF'
          const { Pool } = require('pg');
          
          async function initializeSchema() {
            const clientName = '${{ inputs.client_name }}';
            const domain = '${{ inputs.domain }}';
            const schemaName = clientName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
            
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            
            try {
              console.log('Creating schema:', schemaName);
              await pool.query(`CREATE SCHEMA IF NOT EXISTS "${schemaName}"`);
              
              console.log('Creating store_settings table...');
              await pool.query(`
                CREATE TABLE IF NOT EXISTS "${schemaName}".store_settings (
                  id SERIAL PRIMARY KEY,
                  store_name VARCHAR(255) NOT NULL,
                  tagline TEXT NOT NULL,
                  address TEXT NOT NULL,
                  phone VARCHAR(50) NOT NULL,
                  email VARCHAR(255),
                  monday_hours VARCHAR(100) NOT NULL,
                  tuesday_hours VARCHAR(100) NOT NULL,
                  wednesday_hours VARCHAR(100) NOT NULL,
                  thursday_hours VARCHAR(100) NOT NULL,
                  friday_hours VARCHAR(100) NOT NULL,
                  saturday_hours VARCHAR(100) NOT NULL,
                  sunday_hours VARCHAR(100) NOT NULL,
                  about_title VARCHAR(255) NOT NULL,
                  about_description TEXT NOT NULL,
                  about_story TEXT NOT NULL,
                  founded_year VARCHAR(10) NOT NULL,
                  logo_url TEXT,
                  favicon_url TEXT,
                  hero_image_url TEXT,
                  about_image_url TEXT,
                  primary_color VARCHAR(20) NOT NULL,
                  secondary_color VARCHAR(20) NOT NULL,
                  accent_color VARCHAR(20) NOT NULL,
                  font_family VARCHAR(100) NOT NULL,
                  facebook_url TEXT,
                  instagram_url TEXT,
                  x_url TEXT,
                  google_url TEXT,
                  yelp_url TEXT,
                  seo_title TEXT NOT NULL,
                  seo_description TEXT NOT NULL,
                  seo_keywords TEXT NOT NULL,
                  created_at TIMESTAMP DEFAULT NOW(),
                  updated_at TIMESTAMP DEFAULT NOW()
                )
              `);
              
              console.log('Creating product_categories table...');
              await pool.query(`
                CREATE TABLE IF NOT EXISTS "${schemaName}".product_categories (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(255) NOT NULL,
                  description TEXT NOT NULL,
                  image_url TEXT NOT NULL,
                  featured BOOLEAN NOT NULL DEFAULT false,
                  sort_order INTEGER NOT NULL DEFAULT 0,
                  created_at TIMESTAMP DEFAULT NOW(),
                  updated_at TIMESTAMP DEFAULT NOW()
                )
              `);
              
              console.log('Creating special_services table...');
              await pool.query(`
                CREATE TABLE IF NOT EXISTS "${schemaName}".special_services (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(255) NOT NULL,
                  description TEXT NOT NULL,
                  icon VARCHAR(100) NOT NULL,
                  featured BOOLEAN NOT NULL DEFAULT false,
                  sort_order INTEGER NOT NULL DEFAULT 0,
                  created_at TIMESTAMP DEFAULT NOW(),
                  updated_at TIMESTAMP DEFAULT NOW()
                )
              `);
              
              console.log('Creating featured_brands table...');
              await pool.query(`
                CREATE TABLE IF NOT EXISTS "${schemaName}".featured_brands (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(255) NOT NULL,
                  description TEXT NOT NULL,
                  logo_url TEXT NOT NULL,
                  website_url TEXT NOT NULL,
                  featured BOOLEAN NOT NULL DEFAULT false,
                  sort_order INTEGER NOT NULL DEFAULT 0,
                  created_at TIMESTAMP DEFAULT NOW(),
                  updated_at TIMESTAMP DEFAULT NOW()
                )
              `);
              
              // Check if data already exists
              const existingData = await pool.query(`SELECT COUNT(*) FROM "${schemaName}".store_settings`);
              
              if (existingData.rows[0].count === '0') {
                console.log('Inserting default store settings...');
                const storeName = clientName.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                
                await pool.query(`
                  INSERT INTO "${schemaName}".store_settings (
                    store_name, tagline, address, phone, email,
                    monday_hours, tuesday_hours, wednesday_hours, thursday_hours, friday_hours,
                    saturday_hours, sunday_hours, about_title, about_description, about_story,
                    founded_year, primary_color, secondary_color, accent_color, font_family,
                    seo_title, seo_description, seo_keywords
                  ) VALUES (
                    $1, 'Your trusted local business', '123 Main Street, Your City, State 12345',
                    '(555) 123-4567', $2, '9:00 AM - 6:00 PM', '9:00 AM - 6:00 PM',
                    '9:00 AM - 6:00 PM', '9:00 AM - 6:00 PM', '9:00 AM - 6:00 PM',
                    '9:00 AM - 4:00 PM', 'Closed', $3, 'A trusted local business serving our community',
                    'Our story begins with a commitment to quality and service...', $4,
                    '#2563eb', '#64748b', '#f59e0b', 'Inter', $5, 'Your trusted local business providing quality products and services.',
                    'local business, quality service, trusted provider'
                  )
                `, [
                  storeName,
                  `info@${domain}`,
                  `About ${storeName}`,
                  new Date().getFullYear().toString(),
                  `${storeName} - Quality Service`
                ]);
              }
              
              console.log('Schema initialization completed successfully');
              
            } catch (error) {
              console.error('Schema initialization failed:', error.message);
              process.exit(1);
            } finally {
              await pool.end();
            }
          }
          
          initializeSchema();
          EOF
          
          # Run schema initialization
          node schema-init.cjs
          
          # Configure environment for shared database
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
          echo "CLIENT_CONFIG_PATH=./client-config.json" >> .env
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> .env
          echo "NODE_ENV=production" >> .env
          echo "CLIENT_NAME=${{ inputs.client_name }}" >> .env
          echo "Shared database configured with client schema"

      - name: Create optimized GitHub repository
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          cd deployments/${{ inputs.client_name }}
          
          # Check if repository already exists
          if gh repo view tred-io/${{ inputs.client_name }}-website >/dev/null 2>&1; then
            echo "Repository tred-io/${{ inputs.client_name }}-website already exists"
            echo "Using existing repository for deployment"
          else
            echo "Creating new repository tred-io/${{ inputs.client_name }}-website"
            gh repo create tred-io/${{ inputs.client_name }}-website \
              --public \
              --description "Website configuration for ${{ inputs.client_name }}" \
              --clone=false
            
            # Wait for repository to be fully initialized
            echo "Waiting for repository initialization..."
            sleep 10
          fi
          
          # Push only client-specific files with token authentication
          if git remote get-url origin >/dev/null 2>&1; then
            echo "Remote origin already exists, removing and re-adding"
            git remote remove origin
          fi
          git remote add origin https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/tred-io/${{ inputs.client_name }}-website.git
          
          # Retry push with exponential backoff
          for i in {1..3}; do
            if git push -u origin main; then
              echo "Successfully pushed to repository"
              PUSH_SUCCESS=true
              break
            else
              echo "Push attempt $i failed, retrying in $((i * 5)) seconds..."
              sleep $((i * 5))
              PUSH_SUCCESS=false
            fi
          done
          
          if [ "$PUSH_SUCCESS" != "true" ]; then
            echo "Failed to push to repository after 3 attempts"
            exit 1
          fi

      - name: Deploy to Vercel with GitHub connection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd deployments/${{ inputs.client_name }}
          
          # Create Vercel project connected to GitHub repository
          PROJECT_NAME="${{ inputs.client_name }}-website"
          GITHUB_REPO="tred-io/${{ inputs.client_name }}-website"
          
          echo "Creating Vercel project $PROJECT_NAME connected to GitHub repository $GITHUB_REPO"
          
          # Create project with GitHub connection using Vercel API
          RESPONSE=$(curl -s -w "%{http_code}" -X POST "https://api.vercel.com/v10/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "'$PROJECT_NAME'",
              "gitRepository": {
                "type": "github",
                "repo": "'$GITHUB_REPO'"
              },
              "buildCommand": "npm run build",
              "outputDirectory": "dist/public",
              "installCommand": "npm install",
              "framework": "vite"
            }')
          
          HTTP_CODE="${RESPONSE: -3}"
          RESPONSE_BODY="${RESPONSE%???}"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "Vercel project created successfully"
            PROJECT_ID=$(echo "$RESPONSE_BODY" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          else
            echo "Project creation response: $RESPONSE_BODY"
            # Check if project already exists
            EXISTING_PROJECT=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$PROJECT_NAME")
            
            if echo "$EXISTING_PROJECT" | grep -q '"id"'; then
              echo "Project $PROJECT_NAME already exists, using existing project"
              PROJECT_ID=$(echo "$EXISTING_PROJECT" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
            else
              echo "Failed to create or find project $PROJECT_NAME"
              exit 1
            fi
          fi
          
          # Set environment variables for the project
          echo "Setting environment variables for project $PROJECT_ID"
          
          # Set DATABASE_URL
          curl -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "DATABASE_URL",
              "value": "'${{ secrets.DATABASE_URL }}'",
              "type": "encrypted",
              "target": ["production", "preview", "development"]
            }'
          
          # Set CLIENT_NAME
          curl -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "CLIENT_NAME",
              "value": "'${{ inputs.client_name }}'",
              "type": "encrypted",
              "target": ["production", "preview", "development"]
            }'
          
          # Set CLIENT_CONFIG_PATH
          curl -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "CLIENT_CONFIG_PATH",
              "value": "./client-config.json",
              "type": "encrypted",
              "target": ["production", "preview", "development"]
            }'
          
          # Set SESSION_SECRET
          SESSION_SECRET=$(openssl rand -base64 32)
          curl -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "SESSION_SECRET",
              "value": "'$SESSION_SECRET'",
              "type": "encrypted",
              "target": ["production", "preview", "development"]
            }'
          
          # Set NODE_ENV
          curl -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "NODE_ENV",
              "value": "production",
              "type": "encrypted",
              "target": ["production"]
            }'
          
          echo "Vercel project created and connected to GitHub repository"
          
          # Wait for GitHub repository to sync, then trigger deployment
          echo "Waiting for GitHub repository to sync..."
          sleep 15
          
          # Trigger initial deployment
          echo "Triggering initial deployment..."
          DEPLOY_RESPONSE=$(curl -s -w "%{http_code}" -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "'$PROJECT_NAME'",
              "gitSource": {
                "type": "github",
                "repo": "'$GITHUB_REPO'",
                "ref": "main"
              },
              "target": "production"
            }')
          
          DEPLOY_HTTP_CODE="${DEPLOY_RESPONSE: -3}"
          DEPLOY_BODY="${DEPLOY_RESPONSE%???}"
          
          if [ "$DEPLOY_HTTP_CODE" = "200" ] || [ "$DEPLOY_HTTP_CODE" = "201" ]; then
            DEPLOYMENT_URL=$(echo "$DEPLOY_BODY" | grep -o '"url":"[^"]*"' | cut -d'"' -f4)
            echo "Initial deployment triggered successfully: $DEPLOYMENT_URL"
            echo "Future deployments will happen automatically on git push."
          else
            echo "Deployment failed with response: $DEPLOY_BODY"
            echo "Vercel project created but initial deployment failed. Check repository content and try manual deployment."
          fi

      - name: Create deployment summary
        run: |
          CLIENT_SIZE=$(du -sh deployments/${{ inputs.client_name }} | cut -f1)
          echo "## Efficient Client Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Client:** ${{ inputs.client_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Domain:** ${{ inputs.domain }}" >> $GITHUB_STEP_SUMMARY
          echo "**Storage used:** $CLIENT_SIZE (vs 200MB+ for full copy)" >> $GITHUB_STEP_SUMMARY
          echo "**Files created:** 5 configuration files only" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Efficiency Benefits:" >> $GITHUB_STEP_SUMMARY
          echo "- 99%+ storage savings per client" >> $GITHUB_STEP_SUMMARY
          echo "- Single template codebase to maintain" >> $GITHUB_STEP_SUMMARY
          echo "- Instant template updates across all clients" >> $GITHUB_STEP_SUMMARY
          echo "- Scales to thousands of clients efficiently" >> $GITHUB_STEP_SUMMARY